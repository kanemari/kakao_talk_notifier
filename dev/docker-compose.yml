# A throw-away Home Assistant for trying the integration by hand.
#   cd dev && docker compose up
# then open http://localhost:8123 and add "KakaoTalk Notifier" under
# Settings > Devices & services. Config lives in dev/config (git-ignored).
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ../custom_components/kakao_talk:/config/custom_components/kakao_talk:ro
    restart: unless-stopped
