send_message:
  name: Send message
  description: >-
    Send a KakaoTalk message to yourself, and to friends if send_to_friends is on.
  fields:
    title:
      name: Title
      description: Optional title. Shown above the message, separated by a blank line.
      example: "Your Garage Door Friend"
      selector:
        text:
    message:
      name: Message
      description: Message body of the notification.
      required: true
      example: "The garage door has been open for 10 minutes."
      selector:
        text:
    url:
      name: Image URL
      description: >-
        Address of an image, which should be reachable from the internet. When set,
        the message is sent as a card with the image, the title and the message.
      example: "https://example.com/snapshot.png"
      selector:
        text:
    image:
      name: Image
      description: >-
        An image from your Home Assistant media (JPEG or PNG, up to 5 MB). It is
        uploaded to Kakao, so it does not need to be reachable from the internet.
        Use this or Image URL, not both.
      selector:
        media:
          # Without "accept" Home Assistant ties the picker to a media player
          # entity and leaves it disabled. Needs Home Assistant 2025.7 or newer.
          accept:
            - image/jpeg
            - image/png
    link_to_image:
      name: Open the image when tapped
      description: >-
        For an image message, make tapping it open the image instead of Home
        Assistant. Overrides the integration setting. The image's domain must be
        registered at Kakao (App > Product Link > Web domain); if Kakao refuses the
        message it is sent again with the normal link.
      selector:
        boolean:
    link_url:
      name: Link address
      description: >-
        Address the message (and its button) opens when tapped, instead of the
        configured one. Its domain must be registered at Kakao. Takes priority over
        Open the image when tapped. Use a harmless page so a tap does not open
        Home Assistant.
      example: "https://example.com/doorbell"
      selector:
        text:
    friends:
      name: Friends
      description: >-
        Nicknames or uuids to send this message to, instead of the friends list in
        the integration settings. See kakao_talk.list_friends. Needs "Also send to
        friends" turned on in the integration settings.
      example: '["Alice", "Bob"]'
      selector:
        object:
    send_to_friends:
      name: Send to friends
      description: Override the "Also send to friends" setting for this message.
      selector:
        boolean:
    send_to_me:
      name: Send to me
      description: >-
        Also send a copy to your own chatroom. Turn off to message only the friends.
      default: true
      selector:
        boolean:

list_friends:
  name: List friends
  description: >-
    Return the Kakao Talk friends (nickname and uuid) that Kakao makes available to
    this app, and refresh the cached list. Use it to find the names or uuids to put
    in the `friends` setting.

login:
  name: Log in to KakaoTalk
  description: >-
    Start a KakaoTalk login (administrators only). Creates a notification with a
    single-use login link that expires in 10 minutes. Open the link on a device on
    your home network.

friend_invite_link:
  name: Friend invite link
  description: >-
    Get a link to send to a friend so they can give their permission (friends
    list and messages) with a normal Kakao sign-in, instead of using the Kakao
    console. Administrators only. Creates a notification with the link, which
    cannot log anyone in to this integration. The friend must already be invited
    under App > Member in the Kakao Developers console. For friends away from
    home, set a public address for friend invites in the integration settings.
