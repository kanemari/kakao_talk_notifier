send_message:
  name: Send message
  description: Send a KakaoTalk notification.
  fields:
    title:
      name: Title
      description: Optional title. Composed as '%title\n\n%message' for text messages.
      example: "Your Garage Door Friend"
      selector:
        text:
    message:
      name: Message
      description: Message body of the notification.
      required: true
      example: "The garage door has been open for 10 minutes."
      selector:
        text:
    url:
      name: Image URL
      description: Remote path to an image. When set, a feed-style message is sent.
      example: "http://k.kakaocdn.net/dn/bDgfik/btqwQWk4CRU/P6wNJJiQ3Ko21KNE1TiLw1/kakaolink40_original.png"
      selector:
        text:
